server:
  port: ${PORT:8080}

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${DB_NAME:academy}
    username: ${DB_USER:academy}
    password: ${DB_PASSWORD:academy}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  sql:
    init:
      mode: never
  jms:
    pub-sub-domain: false
  activemq:
    broker-url: ${JMS_BROKER_URL:tcp://mq:61616}
    user: ${JMS_USER:admin}
    password: ${JMS_PASSWORD:admin}
    packages:
      trust-all: true
  mail:
    host: ${MAIL_HOST:mailhog}
    port: ${MAIL_PORT:1025}
    username: ""
    password: ""
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

logging:
  level:
    org.hibernate.SQL: INFO
